# Marks issues and pull requests with no activity as stale, then closes them.
# See https://github.com/actions/stale for options.
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '39 16 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v11
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue has had no activity for 60 days and will be closed in 7 days unless there is new activity.'
        stale-pr-message: 'This pull request has had no activity for 60 days and will be closed in 7 days unless there is new activity.'
        stale-issue-label: 'no-issue-activity'
        stale-pr-label: 'no-pr-activity'
